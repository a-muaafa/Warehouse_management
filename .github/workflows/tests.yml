name: Laravel CI / Tests & Security Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  tests:
    name: PHPUnit (MySQL 8.0), Pint & Dependency Audit
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: wms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: wms_test
      DB_USERNAME: root
      DB_PASSWORD: secret

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Check Code Formatting (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Database Migrations & Essential Seeders
        run: |
          php artisan config:clear
          php artisan migrate --force
          php artisan db:seed --class=RolesAndPermissionsSeeder --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wms_test
          DB_USERNAME: root
          DB_PASSWORD: secret

          
      - name: Run Unit Tests
        run: php artisan test --testsuite=Unit

      - name: Run Feature Tests
        run: php artisan test --testsuite=Feature

      - name: Composer Security Audit
        run: composer audit --no-interaction
